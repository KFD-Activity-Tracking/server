






services:
  mysql:
    image: mysql:8.0
    container_name: tracker_mysql
    environment:
      MYSQL_DATABASE : activity_tracker
      MYSQL_USER: user
      MYSQL_PASSWORD: vq09t9h5c90cgh8ovy
      MYSQL_ROOT_PASSWORD: rootpassword

    volumes:
      - mysql_volume:/var/lib/mysql


    ports:
      - "3306:3306"

    networks:
      - tracker_network

  server:
    container_name: tracker_server
    environment:
      DB_URL: jdbc:mysql://mysql:3306/activity_tracker
      DB_USER: user
      DB_PASSWORD: vq09t9h5c90cgh8ovy

    build:
      context: ../../../../
      dockerfile: src/main/resources/docker/Dockerfile

    pull_policy: build

    depends_on:
      mysql:
        condition: service_started

    ports:
      - "8765:8765"

    networks:
      - tracker_network



  ollama:
    image: ollama/ollama:latest
    container_name: tracker_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_volume:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - tracker_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 30s
      timeout: 10s
      retries: 3





volumes:
  mysql_volume:
  ollama_volume:


networks:
  tracker_network:




























































