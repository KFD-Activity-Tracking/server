spring:
  application:
    name: activitytracker





  datasource:
    url: ${DB_URL:jdbc:h2:mem:activitytracker;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  # Hibernate/JPA settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false



ollama:
  url: ${OLLAMA_URL:http://ollama:11434}

ai:
  model:
    name: tinyllama:latest
  enabled: true
  fallback:
    no-model: true
  optimization:
    max_actions: 150
    cache_ttl_minutes: 5
    timeout_seconds: 15
    max_prompt_length: 2000



